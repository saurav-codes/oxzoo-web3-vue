# ox deploy manifest for oxzoo-web3-vue.
# npm builds the SPA into dist/, nginx serves dist/ statically (spa = true)
# while proxying /api and /health to the express server.

name = "oxzoo-web3-vue"
branch = "main"
runtime = "node"
package_manager = "npm"
port = 9116
required_packages = ["nodejs"]

[[apt_sources]]
name = "nodesource"
url = "https://deb.nodesource.com/node_22.x"
suite = "nodistro"
components = ["main"]
key_url = "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"

[[processes]]
name = "web"
command = "node server.js"
readiness = "http://127.0.0.1:{port}/health"

[deploy]
install = ["npm install"]
build = ["npm", "run", "build"]
health_url = "http://127.0.0.1:9116/health"

[frontend]
dist = "dist"
api_paths = ["/api", "/health"]

[[domains]]
name = "web3.oxzoo.sorv.dev"
tls = true
spa = true
